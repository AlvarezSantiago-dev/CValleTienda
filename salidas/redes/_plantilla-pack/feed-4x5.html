<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, height=1350" />
  <title>CValleTienda — feed caja</title>
  <style>
    @font-face {
      font-family: "Outfit";
      src: url("../../../.claude/skills/canvas-design/canvas-fonts/Outfit-Regular.ttf") format("truetype");
      font-weight: 400;
    }
    @font-face {
      font-family: "Outfit";
      src: url("../../../.claude/skills/canvas-design/canvas-fonts/Outfit-Bold.ttf") format("truetype");
      font-weight: 600;
    }
    @font-face {
      font-family: "Instrument Sans";
      src: url("../../../.claude/skills/canvas-design/canvas-fonts/InstrumentSans-Regular.ttf") format("truetype");
      font-weight: 400;
    }
    @font-face {
      font-family: "Instrument Sans";
      src: url("../../../.claude/skills/canvas-design/canvas-fonts/InstrumentSans-Bold.ttf") format("truetype");
      font-weight: 700;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1350px; overflow: hidden; background: #0a0a09; }

    .canvas {
      position: relative;
      width: 1080px;
      height: 1350px;
      padding: 56px 56px 48px;
      background:
        radial-gradient(ellipse 70% 40% at 50% 72%, rgb(101 163 13 / 0.08), transparent 55%),
        radial-gradient(ellipse 80% 45% at 18% 0%, rgb(101 163 13 / 0.06), transparent 50%),
        #0a0a09;
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    .top {
      display: flex;
      align-items: center;
      gap: 14px;
      height: 40px;
    }
    .top img { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; }
    .wordmark {
      font-family: "Outfit", system-ui, sans-serif;
      font-weight: 600;
      font-size: 22px;
      letter-spacing: 0.04em;
      color: #a9a8a2;
    }
    .catalog {
      margin-left: auto;
      font-family: "Outfit", system-ui, sans-serif;
      font-size: 13px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #5b5a54;
    }

    .hook-block { margin-top: 36px; padding-left: 22px; border-left: 3px solid #84cc16; }
    .hook {
      font-family: "Instrument Sans", system-ui, sans-serif;
      font-weight: 700;
      font-size: 52px;
      line-height: 1.06;
      letter-spacing: -0.03em;
    }
    .hook .q { color: #84cc16; }
    .sub {
      margin-top: 14px;
      font-family: "Instrument Sans", system-ui, sans-serif;
      font-size: 24px;
      line-height: 1.3;
      color: #d7d6d2;
    }

    .puesto {
      position: relative;
      margin-top: auto;
      height: 720px;
      display: grid;
      grid-template-columns: 230px 1fr 230px;
      align-items: end;
      gap: 0;
      padding-bottom: 36px;
    }

    .hw {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      height: 340px;
      margin-bottom: 8px;
    }
    .hw img {
      max-width: 230px;
      max-height: 330px;
      object-fit: contain;
      filter: drop-shadow(0 18px 28px rgb(0 0 0 / 0.55));
    }
    .hw.scanner { justify-content: flex-start; transform: translate(8px, 12px); }
    .hw.printer { justify-content: flex-end; transform: translate(-8px, 18px); }

    .pc {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 6px;
    }
    .bezel {
      background: linear-gradient(180deg, #1c1c1a, #121211);
      border-radius: 16px;
      padding: 12px 12px 16px;
      box-shadow:
        0 0 0 1px #2e2e2a,
        0 32px 70px rgb(0 0 0 / 0.55);
    }
    .webcam {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2a2a28;
      margin: 0 auto 8px;
      box-shadow: inset 0 0 0 1px #3a3a36;
    }
    .screen {
      width: 500px;
      height: 430px;
      border-radius: 4px;
      overflow: hidden;
      background: #fafaf9;
    }
    .screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top left;
      display: block;
    }
    .neck {
      width: 22px;
      height: 36px;
      background: linear-gradient(90deg, #161615, #242422, #161615);
    }
    .foot {
      width: 148px;
      height: 12px;
      border-radius: 6px 6px 3px 3px;
      background: #1a1a18;
      box-shadow: 0 4px 10px rgb(0 0 0 / 0.4);
    }

    .counter {
      position: absolute;
      left: -8px;
      right: -8px;
      bottom: 0;
      height: 22px;
      z-index: 4;
      background: linear-gradient(180deg, #1f1f1c, #0e0e0d);
      border-top: 1px solid #3a3a32;
      box-shadow: 0 -8px 24px rgb(0 0 0 / 0.35);
    }

    .bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      margin-top: 8px;
    }
    .geo {
      font-family: "Outfit", system-ui, sans-serif;
      font-size: 18px;
      color: #5b5a54;
    }
    .cta {
      font-family: "Outfit", system-ui, sans-serif;
      font-weight: 600;
      font-size: 18px;
      color: #0a0a09;
      background: #65a30d;
      padding: 12px 22px;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <article class="canvas">
    <header class="top">
      <img src="../../logo-cloudvalle.png" alt="" />
      <span class="wordmark">CValleTienda</span>
      <span class="catalog">{{CATALOG}}</span>
    </header>
    <div class="hook-block">
      <h1 class="hook">{{HOOK}}</h1>
      <p class="sub">{{SUB}}</p>
    </div>
    <div class="puesto">
      <div class="hw scanner">
        <img src="assets/scanner-usb.png" alt="" />
      </div>
      <div class="pc">
        <div class="bezel">
          <div class="webcam"></div>
          <div class="screen">
            <img src="{{SHOT_SRC}}" alt="" />
          </div>
        </div>
        <div class="neck"></div>
        <div class="foot"></div>
      </div>
      <div class="hw printer">
        <img src="assets/impresora-termica.png" alt="" />
      </div>
      <div class="counter"></div>
    </div>
    <footer class="bottom">
      <span class="geo">{{GEO}}</span>
      <span class="cta">{{CTA}}</span>
    </footer>
  </article>
</body>
</html>
