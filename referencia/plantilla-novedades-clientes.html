<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title><!-- {{TITULO}} --> CV-MiTienda — Novedades {{MES}}</title>
  <!--
    PLANTILLA: Novedades para clientes
    Duplicar este archivo, renombrar a salidas/YYYY-MM-DD-novedades-clientes-cvalletienda.html
    Reemplazar: {{TITULO}}, {{MES}}, {{SECCIONES}} (bloques .page)
    Referencia completa: salidas/2026-06-18-novedades-clientes-cvalletienda.html

    Secciones estándar (Jun 2026 v2):
    - Portada
    - Gráficos y reportes
    - Productos y precios
    - Inicio y turnos de caja
    - Cierre de caja
    - POS (cobro guiado + atajos opcional)
    - Correcciones (horario, tickets)
    - Cierre / contacto

    Capturas: salidas/capturas/*.png — ver comentarios CAPTURA: en el HTML de referencia
  -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #0A0A0A;
      --lime: #65a30d;
      --lime-b: #84cc16;
      --lime-l: #f7fee7;
      --gray1: #f9fafb;
      --gray3: #e5e7eb;
      --gray4: #9ca3af;
      --gray5: #6b7280;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 11pt;
      line-height: 1.55;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    @page {
      size: A4 portrait;
      margin: 0;
    }
    .page {
      width: 210mm;
      background: #fff;
      page-break-after: always;
      break-after: page;
      overflow: hidden;
    }
    .page-inner {
      padding: 14mm 16mm;
      height: 100%;
      box-sizing: border-box;
    }
    .eyebrow {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--lime);
      background: var(--lime-l);
      padding: 4px 10px;
      border-radius: 100px;
      display: inline-block;
      margin-bottom: 10px;
    }
    h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    .lead { color: var(--gray5); margin-bottom: 14px; }
    .check-list { list-style: none; }
    .check-list li {
      padding-left: 22px;
      position: relative;
      margin-bottom: 8px;
    }
    .check-list li::before {
      content: '✓';
      position: absolute;
      left: 0;
      color: var(--lime);
      font-weight: 700;
    }
    .tip-box {
      background: var(--lime-l);
      border-left: 3px solid var(--lime-b);
      padding: 12px 14px;
      margin-top: 16px;
    }
    @media print {
      html, body { margin: 0 !important; padding: 0 !important; width: 210mm; }
      .page {
        width: 210mm;
        height: 297mm;
        margin: 0 !important;
        page-break-after: always;
      }
      .page-inner { height: 100%; min-height: 0; }
    }
    @media screen {
      body { background: #e5e7eb; padding: 10mm 0; }
      .page { min-height: 297mm; margin: 0 auto 8mm; }
    }
  </style>
</head>
<body>

  <!-- {{SECCION: PORTADA}} -->
  <section class="page" style="background: var(--black); color: #fff; padding: 16mm;">
    <p style="color: var(--lime-b); font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;">Actualización {{MES}}</p>
    <h1 style="font-size: 36px; font-weight: 900; margin: 12px 0;">{{TITULO}}</h1>
    <p style="color: rgba(255,255,255,0.65);">{{SUBTITULO}}</p>
  </section>

  <!-- {{SECCION: repetir .page por cada tema}} -->
  <section class="page">
    <div class="page-inner">
      <span class="eyebrow">Nuevo</span>
      <h2><!-- Título de sección --></h2>
      <p class="lead"><!-- Descripción --></p>
      <ul class="check-list">
        <li><!-- Beneficio 1 --></li>
        <li><!-- Beneficio 2 --></li>
      </ul>
      <div class="tip-box"><strong>Tip:</strong> <!-- consejo --></div>
    </div>
  </section>

  <!-- {{SECCION: CIERRE + contacto}} -->

</body>
</html>
