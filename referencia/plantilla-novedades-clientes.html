<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title><!-- {{TITULO}} --> CV-MiTienda — Novedades {{MES}}</title>
  <!--
    PLANTILLA: Novedades para clientes
    Duplicar este archivo, renombrar a salidas/YYYY-MM-DD-novedades-clientes-cvalletienda.html
    Reemplazar: {{TITULO}}, {{MES}}, {{SECCIONES}} (bloques .page)
    Referencias:
      - Junio:  salidas/2026-06-18-novedades-clientes-cvalletienda.html
      - Agosto: salidas/2026-08-21-novedades-clientes-cvalletienda.html

    Secciones estándar (Ago 2026):
    - Portada
    - Contenido (Nuevo / Mejora)
    - Correcciones (badge .eyebrow.fix)
    - Próximamente (badge .eyebrow.soon)
    - Cierre / contacto

    CSS print: UNA caja de altura por .page. NO anidar min-height: 297mm
    en .page-inner ni .cover (rompe a 2 hojas por sección).

    Capturas: salidas/capturas/*.png — solo comentarios HTML, nunca texto visible CAPTURA:

    PDF:
      node scripts/generar-pdf-novedades.mjs --html salidas/...html --out salidas/...pdf --pages N
  -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #0A0A0A;
      --lime: #65a30d;
      --lime-b: #84cc16;
      --lime-l: #f7fee7;
      --gray1: #f9fafb;
      --gray2: #f3f4f6;
      --gray3: #e5e7eb;
      --gray4: #9ca3af;
      --gray5: #6b7280;
      --fix: #b45309;
      --fix-bg: #fffbeb;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 11pt;
      line-height: 1.55;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    @page {
      size: A4 portrait;
      margin: 0;
    }
    .page {
      width: 210mm;
      background: #fff;
      page-break-after: always;
      break-after: page;
      overflow: hidden;
    }
    .page-inner {
      padding: 14mm 16mm;
      height: 100%;
      box-sizing: border-box;
      /* SIN min-height: 297mm */
    }
    .eyebrow {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--lime);
      background: var(--lime-l);
      padding: 4px 10px;
      border-radius: 100px;
      display: inline-block;
      margin-bottom: 10px;
    }
    .eyebrow.fix {
      color: var(--fix);
      background: var(--fix-bg);
    }
    .eyebrow.soon {
      color: #fff;
      background: var(--black);
    }
    h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    .lead { color: var(--gray5); margin-bottom: 14px; }
    .check-list { list-style: none; }
    .check-list li {
      padding-left: 22px;
      position: relative;
      margin-bottom: 8px;
    }
    .check-list li::before {
      content: '✓';
      position: absolute;
      left: 0;
      color: var(--lime);
      font-weight: 700;
    }
    .tip-box {
      background: var(--lime-l);
      border-left: 3px solid var(--lime-b);
      padding: 12px 14px;
      margin-top: 16px;
    }
    .fix-item {
      border: 1px solid var(--gray3);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      page-break-inside: avoid;
    }
    .fix-item strong { display: block; margin-bottom: 2px; }
    .quote-box {
      font-size: 13pt;
      font-weight: 700;
      background: var(--gray1);
      border-left: 3px solid var(--lime-b);
      padding: 12px 14px;
      margin: 14px 0;
    }
    .soon-band {
      background: var(--black);
      color: #fff;
      padding: 10mm 16mm 8mm;
    }
    @media print {
      html, body { margin: 0 !important; padding: 0 !important; width: 210mm; }
      .page {
        width: 210mm;
        height: 297mm;
        margin: 0 !important;
        page-break-after: always;
      }
      .page-inner { height: 100%; min-height: 0; }
      .tip-box { margin-top: 12px; }
    }
    @media screen {
      body { background: #e5e7eb; padding: 10mm 0; }
      .page { min-height: 297mm; margin: 0 auto 8mm; }
    }
  </style>
</head>
<body>

  <!-- {{SECCION: PORTADA}} -->
  <section class="page" style="background: var(--black); color: #fff; padding: 16mm;">
    <p style="color: var(--lime-b); font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;">Actualización {{MES}}</p>
    <h1 style="font-size: 36px; font-weight: 900; margin: 12px 0;">{{TITULO}}</h1>
    <p style="color: rgba(255,255,255,0.65);">{{SUBTITULO}}</p>
  </section>

  <!-- {{SECCION: contenido — repetir .page}} -->
  <section class="page">
    <div class="page-inner">
      <span class="eyebrow">Nuevo</span>
      <h2><!-- Título de sección --></h2>
      <p class="lead"><!-- Descripción --></p>
      <ul class="check-list">
        <li><!-- Beneficio 1 --></li>
        <li><!-- Beneficio 2 --></li>
      </ul>
      <div class="tip-box"><strong>Tip:</strong> <!-- consejo --></div>
    </div>
  </section>

  <!-- {{SECCION: CORRECCIONES}} -->
  <section class="page">
    <div class="page-inner">
      <span class="eyebrow fix">Corregido</span>
      <h2>Lo que corregimos</h2>
      <div class="fix-item">
        <strong><!-- Título --></strong>
        <!-- Una línea -->
      </div>
    </div>
  </section>

  <!-- {{SECCION: PRÓXIMAMENTE}} -->
  <section class="page">
    <div class="page-inner">
      <span class="eyebrow soon">Próximamente</span>
      <h2><!-- Título futuro --></h2>
      <div class="quote-box"><!-- Frase de ejemplo --></div>
    </div>
  </section>

  <!-- {{SECCION: CIERRE + contacto}} -->

</body>
</html>
